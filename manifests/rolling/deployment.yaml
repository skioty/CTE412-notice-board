# Purpose: Measure a RollingUpdate release for student 02230141.
# Apply: kubectl apply -f manifests/rolling/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board # Identifies the application Deployment.
  namespace: nb-02230141 # Isolates this student's resources.
  labels:
    app: notice-board # Supports application evidence queries.
  annotations:
    kubernetes.io/change-cause: "Task 5: RollingUpdate release 02230141 to 1.1.0" # Records this release.
spec:
  replicas: 3 # Required application replica count.
  strategy:
    type: RollingUpdate # Replaces replicas gradually.
    rollingUpdate:
      maxUnavailable: 0 # Keeps the desired available capacity during replacement.
      maxSurge: 1 # Allows one extra non-terminating replica during rollout.
  minReadySeconds: 5 # Requires five seconds of readiness before counting a Pod as available.
  selector:
    matchLabels:
      app: notice-board # Stable selector across application versions.
  template:
    metadata:
      labels:
        app: notice-board # Matches the Deployment and Services.
        version: "1.1.0" # Identifies the new release.
    spec:
      containers:
        - name: notice-board # Identifies the application container.
          image: notice-board:02230141-1.1.0 # Locally loaded new release.
          imagePullPolicy: Never # Prevents registry pulls.
          ports:
            - name: http # Named port used by Services and probes.
              containerPort: 8080 # Application listening port.
          resources:
            requests:
              cpu: 50m # Leaves capacity for blue/green and surge replicas.
              memory: 32Mi # Fits concurrent replicas within the request quota.
            limits:
              cpu: 100m # Leaves CPU limit capacity for replicas and the monitor.
              memory: 64Mi # Fits concurrent replicas within the memory limit quota.
          readinessProbe:
            httpGet:
              path: /healthz # Excludes warming-up or unhealthy Pods from traffic.
              port: http # Uses the named application port.
            periodSeconds: 1 # Detects readiness promptly.
            failureThreshold: 1 # Removes readiness after one failed check.
          livenessProbe:
            httpGet:
              path: /version # Checks responsiveness without restarting the deliberately broken release.
              port: http # Uses the named application port.
            initialDelaySeconds: 5 # Allows application startup before checking.
            periodSeconds: 5 # Checks responsiveness at a modest frequency.