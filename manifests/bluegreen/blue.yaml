# Purpose: Run the blue release for student 02230141.
# Apply: kubectl apply -f manifests/bluegreen/blue.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board-blue # Identifies the blue Deployment.
  namespace: nb-02230141 # Isolates this student's resources.
  labels:
    app: notice-board # Supports application evidence queries.
    slot: blue # Separates the blue Deployment and its traffic.
  annotations:
    kubernetes.io/change-cause: "Task 7: 02230141 blue version 1.0.0" # Records this release.
spec:
  replicas: 3 # Required application replica count.
  strategy:
    type: RollingUpdate # Replaces replicas gradually.
    rollingUpdate:
      maxUnavailable: 0 # Keeps healthy replicas available while the new release is unready.
      maxSurge: 1 # Allows one extra non-terminating replica during rollout.
  minReadySeconds: 5 # Requires five seconds of readiness before counting a Pod as available.
  progressDeadlineSeconds: 60 # Reports failure after 60 seconds without rollout progress.
  selector:
    matchLabels:
      app: notice-board # Stable selector across application versions.
      slot: blue # Separates the blue Deployment and its traffic.
  template:
    metadata:
      labels:
        app: notice-board # Matches the Deployment and Services.
        slot: blue # Separates the blue Deployment and its traffic.
        version: "1.0.0" # Identifies the restored healthy release.
    spec:
      containers:
        - name: notice-board # Identifies the application container.
          image: notice-board:02230141-1.0.0 # Matches the restored healthy release.
          imagePullPolicy: Never # Prevents registry pulls.
          ports:
            - name: http # Named port used by Services and probes.
              containerPort: 8080 # Application listening port.
          resources:
            requests:
              cpu: 50m # Leaves request capacity for replicas and the monitor.
              memory: 32Mi # Fits concurrent replicas within the memory request quota.
            limits:
              cpu: 100m # Leaves CPU limit capacity for replicas and the monitor.
              memory: 64Mi # Fits concurrent replicas within the memory limit quota.
          readinessProbe:
            httpGet:
              path: /healthz # Prevents the broken release from receiving Service traffic.
              port: http # Uses the named application port.
            periodSeconds: 1 # Checks readiness frequently.
            failureThreshold: 1 # Removes readiness after one failed check.
          livenessProbe:
            httpGet:
              path: /version # Checks responsiveness without restarting the deliberately unhealthy release.
              port: http # Uses the named application port.
            initialDelaySeconds: 5 # Allows application startup before checking.
            periodSeconds: 5 # Checks responsiveness at a modest frequency.



